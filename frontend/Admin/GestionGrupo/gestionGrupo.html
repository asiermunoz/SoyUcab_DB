<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin | Grupos</title>
  <link rel="stylesheet" href="style.css" />  
  <link rel="icon" type="image/png" href="/frontend/img/mini_logo.png">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <a class="logo" href="admin.html" title="Volver al panel">
      <img src="/frontend/img/logo.png" alt="Logo del sistema">
    </a>
    <div>
      <h1>Administración de Grupos</h1>
      <p>Crear, editar y eliminar grupos del sistema</p>
    </div>
  </div>

  <div class="actions">
    <button id="btnBackAdmin" class="btn ghost" type="button">← Panel</button>
    <button id="btnLogout" class="btn danger" type="button">Cerrar sesión</button>
  </div>
</header>

<main class="wrap">

  <section class="toolbar">
    <div class="search">
      <input id="q" type="text" placeholder="Buscar por nombre, tipo, estado..." autocomplete="off">
    </div>

    <div class="filters">
      <select id="typeFilter">
        <option value="all">Todos</option>
        <option value="publico">Públicos</option>
        <option value="privado">Privados</option>
        <option value="secreto">Secretos</option>
      </select>

      <button id="btnNewGroup" class="btn primary" type="button">+ Crear grupo</button>
    </div>
  </section>

  <section class="tableWrap">
    <table class="table">
      <thead>
        <tr>
          <th>Grupo</th>
          <th>Tipo</th>
          <th>Fecha</th>
          <th>Creador</th>
          <th class="thActions">Acciones</th>
        </tr>
      </thead>
      <tbody id="tbodyGroups"></tbody>
    </table>

    <p id="empty" class="empty hidden">No hay grupos para mostrar.</p>
  </section>
</main>

<!-- Modal Crear/Editar Grupo -->
<div class="overlay hidden" id="modalOverlay">
  <div class="modal" role="dialog" aria-modal="true">
    <div class="modalHead">
      <h2 id="modalTitle">Crear grupo</h2>
      <button class="x" id="btnCloseModal" type="button">✕</button>
    </div>

    <form id="formGroup" class="modalBody">
      <input type="hidden" id="editId" value="">

      <div class="field">
        <label for="nombre">Nombre del grupo</label>
        <input id="nombre" required placeholder="Ej: Comunidad UCAB">
      </div>

      <div class="field">
        <label for="descripcion">Descripción</label>
        <textarea id="descripcion" rows="3" required placeholder="Descripción del grupo..."></textarea>
      </div>

      <div class="field">
        <label for="tipo">Tipo</label>
        <select id="tipo" required>
          <option value="" disabled selected>Selecciona</option>
          <option value="publico">Público</option>
          <option value="privado">Privado</option>
          <option value="secreto">Secreto</option>
        </select>
      </div>

      <div class="field">
        <label for="creador">Creador</label>
        <input id="creador" disabled>
        <small class="help">Se toma automáticamente del usuario admin o sistema.</small>
      </div>

      <div class="field">
        <label for="fecha">Fecha de creación</label>
        <input id="fecha" disabled>
      </div>

      <p class="msg hidden" id="msg"></p>

      <div class="modalFoot">
        <button class="btn ghost" id="btnCancel" type="button">Cancelar</button>
        <button class="btn primary" id="btnSave" type="submit">Guardar</button>
      </div>
    </form>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
