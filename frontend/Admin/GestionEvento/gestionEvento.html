<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin | Eventos</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" type="image/png" href="/frontend/img/mini_logo.png">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <a class="logo" href="../admin.html" title="Volver al panel">
      <img src="/frontend/img/logo.png" alt="Logo del sistema">
    </a>
    <div>
      <h1>Administración de Eventos</h1>
      <p>Crear, editar y eliminar eventos del sistema</p>
    </div>
  </div>

  <div class="actions">
    <button id="btnBackAdmin" class="btn ghost" type="button">← Panel</button>
    <button id="btnLogout" class="btn danger" type="button">Cerrar sesión</button>
  </div>
</header>

<main class="wrap">

  <section class="toolbar">
    <div class="search">
      <input id="q" type="text" placeholder="Buscar por nombre, estado, categoría, creador..." autocomplete="off">
    </div>

    <div class="filters">
      <select id="statusFilter">
        <option value="all">Todos</option>
        <option value="borrador">Borrador</option>
        <option value="publicado">Publicado</option>
        <option value="en_curso">En curso</option>
        <option value="finalizado">Finalizado</option>
        <option value="archivado">Archivado</option>
      </select>

      <button id="btnNewEvent" class="btn primary" type="button">+ Crear evento</button>
    </div>
  </section>

  <section class="tableWrap">
    <table class="table">
      <thead>
        <tr>
          <th>Evento</th>
          <th>Fecha del evento</th>
          <th>Estado</th>
          <th>Creado por</th>
          <th class="thActions">Acciones</th>
        </tr>
      </thead>
      <tbody id="tbodyEvents"></tbody>
    </table>

    <p id="empty" class="empty hidden">No hay eventos para mostrar.</p>
  </section>

</main>

<!-- Modal Crear/Editar Evento -->
<div class="overlay hidden" id="modalOverlay">
  <div class="modal" role="dialog" aria-modal="true">
    <div class="modalHead">
      <h2 id="modalTitle">Crear evento</h2>
      <button class="x" id="btnCloseModal" type="button">✕</button>
    </div>

    <form id="formEvent" class="modalBody">
      <input type="hidden" id="editId" value="">

      <div class="field">
        <label for="nombre">Nombre del evento</label>
        <input id="nombre" required placeholder="Ej: Jornada de Innovación">
      </div>

      <div class="field">
        <label for="fechaEvento">Fecha del evento</label>
        <input id="fechaEvento" type="date" required>
      </div>

      <div class="field">
        <label for="descripcion">Descripción</label>
        <textarea id="descripcion" rows="3" required placeholder="Descripción del evento..."></textarea>
      </div>

      <div class="grid2">
        <div class="field">
          <label for="categoria">Categoría</label>
          <select id="categoria" required>
            <option value="" selected disabled>Selecciona</option>
            <option value="academico">Académico</option>
            <option value="cultural">Cultural</option>
            <option value="deportivo">Deportivo</option>
            <option value="voluntariado">Voluntariado</option>
            <option value="tecnologia">Tecnología</option>
            <option value="social">Social</option>
            <option value="otro">Otro</option>
          </select>
        </div>

        <div class="field">
          <label for="estado">Estado</label>
          <select id="estado" required>
            <option value="" disabled selected>Selecciona</option>
            <option value="borrador">Borrador</option>
            <option value="publicado">Publicado</option>
            <option value="en_curso">En curso</option>
            <option value="finalizado">Finalizado</option>
            <option value="archivado">Archivado</option>
          </select>
        </div>
      </div>

      <div class="grid2">
        <div class="field">
          <label for="direccion">Dirección</label>
          <input id="direccion" required placeholder="Ej: Av. Teherán, Montalbán">
        </div>

        <div class="field">
          <label for="lugarFisico">Lugar físico</label>
          <input id="lugarFisico" required placeholder="Ej: Aula Magna / Cancha / Auditorio">
        </div>
      </div>

      <div class="grid2">
        <div class="field">
          <label for="nombreEntidad">Nombre del grupo/organización/dependencia</label>
          <input id="nombreEntidad" required placeholder="Ej: Grupo UCAB / Org Asociada / Dependencia UCAB">
        </div>

        <div class="field">
          <label for="creadoPor">Creado por</label>
          <input id="creadoPor" disabled>
          <small class="help">Se toma automáticamente del usuario admin.</small>
        </div>
      </div>

      <p class="msg hidden" id="msg"></p>

      <div class="modalFoot">
        <button class="btn ghost" id="btnCancel" type="button">Cancelar</button>
        <button class="btn primary" id="btnSave" type="submit">Guardar</button>
      </div>
    </form>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
