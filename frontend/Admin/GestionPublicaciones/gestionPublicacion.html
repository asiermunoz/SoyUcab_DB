<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin | Publicaciones</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" type="image/png" href="/frontend/img/mini_logo.png">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <a class="logo" href="../admin.html" title="Volver al panel">
      <img src="/frontend/img/logo.png" alt="Logo del sistema">
    </a>
    <div>
      <h1>Administración de Publicaciones</h1>
      <p>Crear, editar y eliminar publicaciones del inicio</p>
    </div>
  </div>

  <div class="actions">
    <button id="btnBackAdmin" class="btn ghost" type="button">← Panel</button>
    <button id="btnLogout" class="btn danger" type="button">Cerrar sesión</button>
  </div>
</header>

<main class="wrap">

  <section class="toolbar">
    <div class="search">
      <input id="q" type="text" placeholder="Buscar por autor o texto..." autocomplete="off">
    </div>

    <div class="filters">
      <button id="btnNewPost" class="btn primary" type="button">+ Crear publicación</button>
    </div>
  </section>

  <section class="tableWrap">
    <table class="table">
      <thead>
        <tr>
          <th>Autor</th>
          <th>Contenido</th>
          <th>Fecha</th>
          <th class="thActions">Acciones</th>
        </tr>
      </thead>
      <tbody id="tbodyPosts"></tbody>
    </table>

    <p id="empty" class="empty hidden">No hay publicaciones para mostrar.</p>
  </section>

</main>

<!-- Modal Crear/Editar Publicación -->
<div class="overlay hidden" id="modalOverlay">
  <div class="modal" role="dialog" aria-modal="true">
    <div class="modalHead">
      <h2 id="modalTitle">Crear publicación</h2>
      <button class="x" id="btnCloseModal" type="button">✕</button>
    </div>

    <form id="formPost" class="modalBody">
      <input type="hidden" id="editId" value="">

      <div class="field">
        <label for="autor">Autor</label>
        <input id="autor" disabled>
      </div>

      <div class="field">
        <label for="contenido">Contenido</label>
        <textarea id="contenido" rows="4" required placeholder="Escribe la publicación..."></textarea>
      </div>

      <div class="field">
        <label for="adjuntos">Adjuntos (imagen, video o PDF)</label>
        <input id="adjuntos" type="file" multiple
              accept="image/*,video/*,application/pdf">
        <small class="help">Puedes seleccionar varios archivos. (Videos muy pesados pueden no guardarse.)</small>

        <div id="previewAdjuntos" class="preview"></div>
      </div>

      <div class="field">
        <label for="fecha">Fecha</label>
        <input id="fecha" disabled>
      </div>

      <p class="msg hidden" id="msg"></p>

      <div class="modalFoot">
        <button class="btn ghost" id="btnCancel" type="button">Cancelar</button>
        <button class="btn primary" id="btnSave" type="submit">Guardar</button>
      </div>
    </form>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
