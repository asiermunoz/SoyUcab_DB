<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SoyUCAB | Acceso</title>

  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/png" sizes="32x32" href="/img/mini_logo.png">
</head>

<body>
  <main class="contenedor">

    <!-- =========================
         PANTALLA 1: INICIO DE SESIÓN
         ========================= -->
    <section class="tarjeta vista" id="vista-login" aria-label="Inicio de sesión">
      <!-- LOGO -->
      <div class="marca">
        <img
          src="/img/logo.png"
          alt="SoyUCAB - Red Social Institucional"
          class="logo-soyucab"
        >
      </div>

      <h1>Inicia Sesión en SoyUCAB</h1>

      <form id="formulario-login">
        <label for="usuario">Correo o Nombre de usuario</label>
        <input
          type="text"
          id="usuario"
          placeholder="correo o nombre de usuario"
          autocomplete="username"
          required
        >

        <div class="fila">
          <label for="contrasena">Contraseña</label>
          <a href="#" id="olvido">¿Olvidaste tu contraseña?</a>
        </div>

        <input
          type="password"
          id="contrasena"
          placeholder="contraseña"
          autocomplete="current-password"
          required
        >

        <div class="fila">
          <label class="recordar">
            <input type="checkbox" id="recordar">
            Recuérdame
          </label>
        </div>

        <button type="submit" id="btnLogin">Iniciar sesión</button>

        <p id="mensaje" class="mensaje"></p>
      </form>

      <div class="separador"></div>

      <button type="button" class="btn-secundario" id="btnIrRegistro">
        Crear cuenta
      </button>
    </section>


    <!-- =========================
         PANTALLA 2: REGISTRO (SELECCIÓN)
         ========================= -->
    <section class="tarjeta vista oculto" id="vista-registro" aria-label="Registro">
      <!-- LOGO "fantasma" como en tu captura -->
      <div class="marca marca-fantasma">
        <img
          src="/img/logo.png"
          alt="SoyUCAB - Red Social Institucional"
          class="logo-soyucab logo-fantasma"
        >
      </div>

      <div class="panel-registro">
        <div class="opciones" aria-label="Tipo de registro">
          <button type="button" class="opcion" data-value="persona" aria-pressed="true">
            Persona
          </button>

          <button type="button" class="opcion" data-value="dependencia" aria-pressed="false">
            Dependencia<br>UCAB
          </button>

          <button type="button" class="opcion" data-value="organizacion" aria-pressed="false">
            Organización<br>Asociada
          </button>
        </div>
      </div>

      <div class="fila fila-centro muted">
        <label class="recordar">
          <input type="checkbox" disabled>
          Recuérdame
        </label>
      </div>

      <button type="button" class="btn-gris" id="btnRegistrarFinal" disabled>
        Registrarse
      </button>

      <p id="mensajeRegistro" class="mensaje"></p>

      <button type="button" class="link-boton" id="btnVolverLogin">
        ← Volver al inicio de sesión
      </button>
    </section>

  </main>

  <script src="app.js"></script>
</body>
</html>
