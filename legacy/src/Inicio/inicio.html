<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Inicio | SoyUCAB</title>
  <link rel="stylesheet" href="/src/Inicio/style.css" />
  <link rel="icon" type="image/png" href="/src/img/favicon.png">
</head>

<body>
  <div class="app">
    <!-- SIDEBAR -->
    <aside class="sidebar">
      <div class="brand">
        <img src="/src/img/logo.png" alt="SoyUCAB" class="logo" />
      </div>

      <div class="avatar" id="sidebarAvatar">
        <span id="sidebarAvatarEmoji">👤</span>
        <img id="sidebarAvatarImg" alt="Foto de perfil">
      </div>

      <nav class="menu" aria-label="Menú principal">
        <a class="item" href="/perfil" aria-disabled="true"><span class="ico">👤</span><span>Mi Perfil</span></a>
        <a class="item active" href="inicio.html"><span class="ico">🏠</span><span>Inicio</span></a>
        <a class="item" href="/busqueda" aria-disabled="true"><span class="ico">🔎</span><span>Buscador</span></a>
        <a class="item" href="/grupos" aria-disabled="true"><span class="ico">👥</span><span>Grupos</span></a>
        <a class="item" href="/eventos" aria-disabled="true"><span class="ico">📅</span><span>Eventos</span></a>
        <a class="item" href="/mapa" aria-disabled="true"><span class="ico">🗺️</span><span>Mapa UCAB</span></a>

        <button class="item logout-item" id="btnLogout" type="button">
          <span class="ico">↩</span><span>Cerrar Sesión</span>
        </button>
      </nav>
    </aside>

    <!-- MAIN -->
    <main class="main">
      <div class="feed">

        <!-- ✅ CREAR PUBLICACIÓN -->
        <section class="composer" id="postComposer">
          <div class="composer-title">Crear publicación</div>

          <form id="postForm" class="composer-form">
            <textarea id="postInput" rows="3" placeholder="¿Qué quieres publicar?" required></textarea>

            <div class="composer-tools">
              <label class="attach-btn" title="Adjuntar archivo">
                📎 Adjuntar
                <input id="postFile" type="file" accept="image/*,video/*,application/pdf" hidden>
              </label>

              <span class="file-name" id="postFileName">Sin archivo</span>

              <button id="postClearFile" class="clear-file" type="button" title="Quitar archivo">✖</button>

              <button class="btn-publish" type="submit">Publicar</button>
            </div>

            <p class="formError hidden" id="postError"></p>
          </form>
        </section>

        <!-- ✅ AQUÍ SE RENDERIZAN LAS PUBLICACIONES DESDE JS -->
        <div id="postsMount"></div>

      </div>
    </main>
  </div>

  <script src="/src/Inicio/app.js"></script>
</body>
</html>
