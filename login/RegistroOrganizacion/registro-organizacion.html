<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Registro como Organización Asociada | SoyUCAB</title>

  <link rel="stylesheet" href="styleRO.css" />
  <link rel="icon" type="image/png" href="/img/icono.png">
</head>

<body>
  <main class="wrap">
    <section class="card" aria-label="Registro como Organización Asociada">

      <div class="brand">
        <img class="logo" src="../../../img/logo.png" alt="SoyUCAB - Red Social Institucional">
      </div>

      <h1>Registrarse como <span>Organización Asociada</span></h1>

      <form id="formOrg" class="form" novalidate>

        <div class="field">
          <label for="nombre">Nombre</label>
          <input id="nombre" name="nombre" type="text" required />
        </div>

        <div class="field">
          <label for="rif">RIF</label>
          <input id="rif" name="rif" type="text" placeholder="Ej: J-12345678-9" required />
        </div>

        <div class="grid-2">
          <div class="field">
            <label for="ciudad">Ciudad</label>
            <input id="ciudad" name="ciudad" type="text" required />
          </div>

          <div class="field">
            <label for="pais">País</label>
            <input id="pais" name="pais" type="text" required />
          </div>
        </div>

        <div class="field">
          <label for="descripcion">Descripción</label>
          <textarea id="descripcion" name="descripcion" rows="4" placeholder="Describe tu organización..."></textarea>
        </div>

        <div class="field">
          <label for="sector">Sector</label>
          <select id="sector" name="sector" required>
            <option value="" selected disabled>Selecciona</option>
            <option value="educacion">Educación</option>
            <option value="salud">Salud</option>
            <option value="tecnologia">Tecnología</option>
            <option value="finanzas">Finanzas</option>
            <option value="ong">ONG</option>
            <option value="otro">Otro</option>
          </select>
        </div>

        <div class="field">
          <label for="miembros">Miembros</label>
          <input id="miembros" name="miembros" type="number" min="1" placeholder="Ej: 25" required />
        </div>

        <div class="field">
          <label for="usuario">Nombre de Usuario</label>
          <input id="usuario" name="usuario" type="text" autocomplete="username" required />
        </div>

        <div class="field">
          <label for="correo">Correo</label>
          <input id="correo" name="correo" type="email" autocomplete="email" required />
        </div>

        <div class="field">
          <label for="contrasena">Contraseña</label>
          <input id="contrasena" name="contrasena" type="password" autocomplete="new-password" required />
        </div>

        <p id="msg" class="msg" aria-live="polite"></p>

        <div class="actions">
          <a class="back" href="../index.html">← Volver</a>
          <button class="btn" type="submit">Registrar</button>
        </div>

      </form>
    </section>
  </main>

  <script src="appRO.js"></script>
</body>
</html>
