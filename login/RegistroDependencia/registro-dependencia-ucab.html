<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Registro como Dependencia UCAB | SoyUCAB</title>

  <link rel="stylesheet" href="styleRD.css" />
  <link rel="icon" type="image/png" href="/img/icono.png">
</head>

<body>
  <main class="wrap">
    <section class="card" aria-label="Registro como Dependencia UCAB">

      <div class="brand">
        <img class="logo" src="../../../img/logo.png" alt="SoyUCAB - Red Social Institucional">
      </div>

      <h1>Registrarse como <span>Dependencia UCAB</span></h1>

      <form id="formDependencia" class="form" novalidate>

        <div class="field">
          <label for="abreviatura">Abreviatura</label>
          <input id="abreviatura" name="abreviatura" type="text" placeholder="Ej: DTI" required />
        </div>

        <div class="field">
          <label for="nombre">Nombre</label>
          <input id="nombre" name="nombre" type="text" placeholder="Ej: Dirección de Tecnología" required />
        </div>

        <div class="field">
          <label for="tipo">Tipo</label>
          <select id="tipo" name="tipo" required>
            <option value="" selected disabled>Selecciona</option>
            <option value="academica">Académica</option>
            <option value="administrativa">Administrativa</option>
            <option value="servicios">Servicios</option>
            <option value="otra">Otra</option>
          </select>
        </div>

        <div class="field">
          <label for="usuario">Nombre de Usuario</label>
          <input id="usuario" name="usuario" type="text" autocomplete="username" required />
        </div>

        <div class="field">
          <label for="correo">Correo</label>
          <input id="correo" name="correo" type="email" autocomplete="email" required />
        </div>

        <div class="field">
          <label for="contrasena">Contraseña</label>
          <input id="contrasena" name="contrasena" type="password" autocomplete="new-password" required />
        </div>

        <p id="msg" class="msg" aria-live="polite"></p>

        <div class="actions">
          <a class="back" href="../index.html">← Volver</a>
          <button class="btn" type="submit">Registrar</button>
        </div>

      </form>
    </section>
  </main>

  <script src="appRD.js"></script>
</body>
</html>
